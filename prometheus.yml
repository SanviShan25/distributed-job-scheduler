global:
  scrape_interval: 5s
scrape_configs:
  - job_name: api
    metrics_path: /actuator/prometheus
    static_configs:
      # The API serves actuator on its internal management port.
      - targets: [api:9091]
  - job_name: workers
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9091   # worker management port

# For local IDE runs (workers default to management port = PORT), comment out the api/worker jobs above and enable:
