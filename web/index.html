<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Website uptime monitoring with email alerts · PulseCheck</title>
    <meta
      name="description"
      content="PulseCheck checks your website every minute and emails you the moment it goes down, and again when it's back. Free, private, and set up in a minute."
    />
    <meta name="theme-color" content="#4338ca" />
    <!-- Email links carry one-time tokens: never send this page's URL to other sites. -->
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Link previews (Open Graph). The app keeps title and description up to date per page. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PulseCheck" />
    <meta property="og:title" content="Website uptime monitoring with email alerts · PulseCheck" />
    <meta
      property="og:description"
      content="PulseCheck checks your website every minute and emails you the moment it goes down, and again when it's back. Free, private, and set up in a minute."
    />
    <meta property="og:locale" content="en" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The PulseCheck dashboard: websites with their status, uptime and response time."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The canonical URL and og:url are set per page by the app (usePageTitle). -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
